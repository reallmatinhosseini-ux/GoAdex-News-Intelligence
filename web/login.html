<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="robots" content="noindex">
  <title>Admin sign in — GoAdex News Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315140f'/%3E%3Cpath d='M9 21l5-6 3.5 3L23 11' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;560;600;650&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/landing.css">
</head>
<body>
  <div class="login-wrap">
    <form class="panel login-card" id="login" novalidate>
      <a class="brand" href="/">
        <div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3 7-9"/></svg></div>
        <div><div class="brand-name">GoAdex</div><div class="brand-sub">News Intelligence</div></div>
      </a>
      <h1>Admin sign in</h1>
      <p>Access is limited to GoAdex administrators.</p>
      <label for="email">Email</label>
      <input class="input" id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <div class="login-err" id="err" role="alert"></div>
      <div class="login-foot">Not an admin? <a href="/#join">Join the waitlist</a></div>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
